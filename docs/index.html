<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1321">
<title>Morning Brief</title>
<style>
  :root {
    --bg: #0d1321; --panel: #161d30; --line: #27314c; --text: #f2efe8; --dim: #9aa3b8;
    --sun: #ffb347; --sun2: #ff7a59; --up: #5fd39a; --down: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); }
  main { max-width: 620px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px;
    letter-spacing: .14em; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--sun), var(--sun2)); }
  h1 { font-size: clamp(26px, 7vw, 38px); line-height: 1.15; margin: 14px 0 6px; letter-spacing: -.02em; text-wrap: balance; }
  .meta { color: var(--dim); font-size: 14px; }
  .player { margin: 22px 0; padding: 20px; border-radius: 22px; background:
    radial-gradient(120% 140% at 0% 0%, rgba(255,179,71,.18), transparent 55%), var(--panel);
    border: 1px solid var(--line); }
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .play { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--sun), var(--sun2)); color: #1b1305;
    box-shadow: 0 10px 30px rgba(255,122,89,.35); }
  .play svg { width: 38px; height: 38px; }
  .skip { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  .bar { margin-top: 20px; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; cursor: pointer; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sun), var(--sun2)); }
  .time { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin-top: 8px;
    font-variant-numeric: tabular-nums; }
  .speed { border: 1px solid var(--line); border-radius: 20px; padding: 2px 12px; color: var(--text); }
  .markets { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 18px; padding-left: 16px; padding-right: 16px; }
  .chip { flex: none; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  .chip b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .chip span { color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 26px 0 10px; }
  .story { padding: 14px 0; border-top: 1px solid var(--line); }
  .tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sun); }
  .story h3 { margin: 2px 0 4px; font-size: 17px; line-height: 1.3; }
  .story p { margin: 0; color: var(--dim); font-size: 14px; }
  .story a { color: var(--dim); font-size: 12px; margin-right: 10px; }
  .watch { padding: 14px; border-radius: 14px; border: 1px dashed var(--line); color: var(--text); font-size: 14px; }
  .past button { display: flex; width: 100%; justify-content: space-between; gap: 12px; text-align: left;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .past small { color: var(--dim); flex: none; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span>Morning Brief</div>
  <h1 id="title">Loading…</h1>
  <div class="meta" id="meta"></div>

  <section class="player">
    <div class="controls">
      <button class="skip" id="back" aria-label="Back 15 seconds">−15</button>
      <button class="play" id="play" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" id="icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="skip" id="fwd" aria-label="Forward 15 seconds">+15</button>
    </div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="time"><span id="now">0:00</span><button class="speed" id="speed">1×</button><span id="len">0:00</span></div>
  </section>

  <div class="markets" id="markets"></div>
  <div id="stories"></div>
  <div id="watch"></div>
  <div class="past" id="past"></div>
</main>
<audio id="audio" preload="metadata"></audio>
<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const nice = d => new Date(d + 'T09:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
let episodes = [];

function show(e, autoplay) {
  $('title').textContent = e.title || 'Morning Brief';
  $('meta').textContent = nice(e.date) + ' · ' + fmt(e.seconds);
  $('len').textContent = fmt(e.seconds);
  audio.src = e.audio;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: e.title || 'Morning Brief', artist: 'Morning Brief', album: nice(e.date) });
  }
  const m = $('markets'); m.replaceChildren();
  (e.markets || []).forEach(x => {
    const c = el('div', 'chip'); c.append(el('span', '', x.name));
    const b = el('b', '', x.value + ' ');
    const mv = el('span', /^[-−]/.test(x.move || '') ? 'down' : 'up', x.move || ''); b.append(mv); c.append(b); m.append(c);
  });
  const s = $('stories'); s.replaceChildren();
  if ((e.stories || []).length) s.append(el('h2', '', 'In this brief'));
  (e.stories || []).forEach(x => {
    const d = el('div', 'story'); d.append(el('div', 'tag', x.tag || ''), el('h3', '', x.headline), el('p', '', x.why || ''));
    (x.sources || []).forEach(u => { try { const h = new URL(u); if (!/^https?:$/.test(h.protocol)) return;
      const a = el('a', '', h.hostname.replace(/^www\./, '')); a.href = h.href; a.target = '_blank'; a.rel = 'noopener'; d.append(a); } catch {} });
    s.append(d);
  });
  const w = $('watch'); w.replaceChildren();
  if (e.watch) { w.append(el('h2', '', 'One to watch'), el('div', 'watch', e.watch)); }
  if (autoplay) audio.play();
}

function list() {
  const p = $('past'); p.replaceChildren();
  if (episodes.length < 2) return;
  p.append(el('h2', '', 'Earlier'));
  episodes.slice(1, 15).forEach(e => {
    const b = el('button'); b.append(el('span', '', e.title || 'Morning Brief'), el('small', '', nice(e.date).split(',')[0] + ' ' + e.date.slice(8)));
    b.onclick = () => { show(e, true); scrollTo({ top: 0, behavior: 'smooth' }); }; p.append(b);
  });
}

$('play').onclick = () => audio.paused ? audio.play() : audio.pause();
$('back').onclick = () => audio.currentTime -= 15;
$('fwd').onclick = () => audio.currentTime += 15;
const speeds = [1, 1.15, 1.3, 1.5]; let si = 0;
try { si = Math.max(0, speeds.indexOf(+localStorage.getItem('speed'))); } catch {}
const setSpeed = () => { audio.defaultPlaybackRate = audio.playbackRate = speeds[si]; $('speed').textContent = speeds[si] + '×'; };
$('speed').onclick = () => { si = (si + 1) % speeds.length; setSpeed(); try { localStorage.setItem('speed', speeds[si]); } catch {} };
audio.onplay = audio.onpause = () => $('icon').firstElementChild.setAttribute('d', audio.paused ? PLAY : PAUSE);
audio.onloadedmetadata = () => { setSpeed(); if (isFinite(audio.duration)) $('len').textContent = fmt(audio.duration); };
audio.ontimeupdate = () => { $('now').textContent = fmt(audio.currentTime); $('fill').style.width = (100 * audio.currentTime / (audio.duration || 1)) + '%'; };
$('bar').onclick = ev => { const r = $('bar').getBoundingClientRect(); audio.currentTime = (ev.clientX - r.left) / r.width * (audio.duration || 0); };

fetch('episodes.json?' + Date.now()).then(r => r.json()).then(d => {
  episodes = d; if (!d.length) throw 0; show(d[0], false); list();
}).catch(() => { $('title').textContent = 'No brief yet'; $('meta').textContent = 'The first one arrives at 9am.'; });
</script>
</body>
</html>
