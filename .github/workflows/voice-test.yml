name: Voice test (one-off)
on:
  push:
    branches: [voice-test]
    paths: ['tools/voice_test.py', '.github/workflows/voice-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OmniVoice (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q omnivoice==0.2.1
          nproc; free -g
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1
      - name: Run the test
        run: mkdir -p voicetest && python tools/voice_test.py 2>&1 | tee voicetest/run.log
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f voicetest
          git commit -m "Voice test results" || exit 0
          git push
