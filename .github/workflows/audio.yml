name: Build episode audio
on:
  push:
    branches: [main]
    paths: ['episodes/*.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-audio
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q kokoro-onnx soundfile
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Fetch the voice model (cached after the first run)
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
          ls -la models
      - name: Build any missing audio
        env:
          BRIEF_TTS: kokoro
        run: |
          for f in episodes/*.txt; do
            d=$(basename "$f" .txt)
            if [ ! -s "docs/audio/$d.mp3" ]; then
              for i in 1 2; do
                python tools/make_episode.py "$d" && break
                sleep 5
              done
              [ -s "docs/audio/$d.mp3" ] || exit 1
            fi
          done
      - name: Commit and push
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Audio $(TZ=Australia/Sydney date +%F)"
            git pull --rebase
            git push
          fi
